<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Kadir Can Girenitlioğlu — Long Horizon</title><desc id="desc">Think from first principles. Build with conviction. Stay useful. Play the long game.</desc>
<style>@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-7px)}}
@keyframes breath{0%,100%{opacity:.28}50%{opacity:.65}}
@keyframes thought{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes emphasis{0%,100%{opacity:0}12%,24%{opacity:1}38%,85%{opacity:0}}
.drift{animation:drift 8s ease-in-out infinite}.breath{animation:breath 8s ease-in-out infinite}.thought{animation:thought 8s ease-in-out infinite}.emphasis{animation:emphasis 8s ease-in-out infinite;opacity:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.emphasis{opacity:0}}</style>
<defs><radialGradient id="haze"><stop stop-color="#b6c6d5" stop-opacity="0.12"/><stop offset="1" stop-color="#f5f3ee" stop-opacity="0"/></radialGradient><radialGradient id="gold"><stop stop-color="#81592e" stop-opacity="0.07"/><stop offset="1" stop-color="#f5f3ee" stop-opacity="0"/></radialGradient></defs>
<rect width="1440" height="760" fill="#f5f3ee"/>
<g class="drift"><ellipse cx="1170" cy="420" rx="395" ry="305" fill="url(#haze)"/><path d="M736 581 Q1070 292 1470 514" fill="none" stroke="#8c9fb0" stroke-width="1.7" opacity=".52"/><path d="M736 593 Q1070 304 1470 526" fill="none" stroke="#8c9fb0" opacity=".12"/></g>
<ellipse class="breath" cx="1150" cy="436" rx="230" ry="64" fill="url(#gold)"/>
<text x="76" y="116" fill="#1c2b3b" font-size="66" font-family="Arial,Helvetica,sans-serif" letter-spacing="1.5" font-weight="700">KADIR CAN</text>
<text x="76" y="196" fill="#1c2b3b" font-size="76" font-family="Arial,Helvetica,sans-serif" letter-spacing=".3" font-weight="700">GIRENITLIOĞLU</text>
<text x="76" y="256" fill="#4e6072" font-size="27" font-family="Arial,Helvetica,sans-serif" >Computer Engineering · Cybersecurity</text>
<text x="76" y="294" fill="#4e6072" font-size="27" font-family="Arial,Helvetica,sans-serif" >Software Engineering · Open Source</text>
<text x="76" y="398" fill="#1c2b3b" font-size="42" font-family="Georgia,serif" >Think from first principles.</text>
<text x="76" y="398" fill="#81592e" font-size="42" font-family="Georgia,serif" class="emphasis" style="animation-delay:-8s">Think from first principles.</text>
<text x="76" y="460" fill="#1c2b3b" font-size="42" font-family="Georgia,serif" >Build with conviction.</text>
<text x="76" y="460" fill="#81592e" font-size="42" font-family="Georgia,serif" class="emphasis" style="animation-delay:-6s">Build with conviction.</text>
<text x="76" y="522" fill="#1c2b3b" font-size="42" font-family="Georgia,serif" >Stay useful.</text>
<text x="76" y="522" fill="#81592e" font-size="42" font-family="Georgia,serif" class="emphasis" style="animation-delay:-4s">Stay useful.</text>
<text x="76" y="584" fill="#1c2b3b" font-size="42" font-family="Georgia,serif" >Play the long game.</text>
<text x="76" y="584" fill="#81592e" font-size="42" font-family="Georgia,serif" class="emphasis" style="animation-delay:-2s">Play the long game.</text>
<text x="76" y="687" fill="#4e6072" font-size="25" font-family="Arial,Helvetica,sans-serif" >Curiosity. Discipline. Patience.</text>
<g class="thought" style="animation-delay:-0.0s"><circle cx="923" cy="461" r="3" fill="#81592e"/><circle cx="923" cy="461" r="9" fill="none" stroke="#81592e" stroke-width=".7" opacity=".35"/></g>
<g class="thought" style="animation-delay:-1.7s"><circle cx="1043" cy="426" r="3" fill="#81592e"/><circle cx="1043" cy="426" r="9" fill="none" stroke="#81592e" stroke-width=".7" opacity=".35"/></g>
<g class="thought" style="animation-delay:-3.4s"><circle cx="1175" cy="424" r="3" fill="#81592e"/><circle cx="1175" cy="424" r="9" fill="none" stroke="#81592e" stroke-width=".7" opacity=".35"/></g>
<g class="thought" style="animation-delay:-5.1s"><circle cx="1298" cy="450" r="3" fill="#81592e"/><circle cx="1298" cy="450" r="9" fill="none" stroke="#81592e" stroke-width=".7" opacity=".35"/></g>
</svg>